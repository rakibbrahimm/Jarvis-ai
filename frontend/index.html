<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAKIB 2.0</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
height:100vh;
overflow:hidden;
font-family:Arial,sans-serif;
background:
radial-gradient(circle at 50% 35%,#063b46 0,#02070b 38%,#000 100%);
color:#00eaff;
display:flex;
flex-direction:column;
align-items:center;
}

h1{
margin:28px 0 4px;
font-size:42px;
letter-spacing:9px;
text-shadow:0 0 20px #00eaff;
}

#status{
font-size:11px;
opacity:.75;
margin-bottom:12px;
}

#orb{
width:180px;
height:180px;
border-radius:50%;
margin:5px 0 15px;
border:2px solid #00eaff;
box-shadow:
0 0 25px #00eaff,
inset 0 0 30px #00eaff;
animation:pulse 2s infinite alternate;
}

@keyframes pulse{
from{transform:scale(.96);opacity:.75}
to{transform:scale(1);opacity:1}
}

#chat{
width:min(92%,720px);
height:45vh;
overflow:auto;
padding:15px;
border:1px solid #00eaff55;
border-radius:18px;
background:#02070bcc;
backdrop-filter:blur(8px);
}

.msg{
padding:11px 14px;
margin:8px 0;
border-radius:12px;
line-height:1.4;
}

.user{
background:#06404a;
text-align:right;
color:#fff;
}

.ai{
background:#101a25;
}

#bar{
width:min(92%,720px);
display:flex;
gap:8px;
margin-top:12px;
}

input{
flex:1;
min-width:0;
padding:14px;
border-radius:13px;
border:1px solid #00eaff66;
outline:none;
background:#02070b;
color:white;
font-size:16px;
}

button{
border:0;
border-radius:13px;
padding:14px 19px;
font-weight:bold;
cursor:pointer;
background:#00eaff;
color:#001015;
}

#mic{
margin-top:10px;
width:58px;
height:58px;
border-radius:50%;
font-size:22px;
padding:0;
}

@media(max-width:600px){
h1{font-size:31px;margin-top:20px}
#orb{width:135px;height:135px}
#chat{height:47vh}
button{padding:13px}
}
</style>
</head>

<body>

<h1>RAKIB</h1>
<div id="status">RAKIB 2.0 INITIALIZING...</div>

<div id="orb"></div>

<div id="chat"></div>

<div id="bar">
<input id="input" placeholder="Ask RAKIB anything...">
<button id="send">SEND</button>
</div>

<button id="mic">🎙️</button>

<script>
const input=document.getElementById("input");
const send=document.getElementById("send");
const mic=document.getElementById("mic");
const chat=document.getElementById("chat");
const status=document.getElementById("status");

function add(text,type){
    const el=document.createElement("div");
    el.className="msg "+type;
    el.textContent=text;
    chat.appendChild(el);
    chat.scrollTop=chat.scrollHeight;
}

async function ask(){
    const command=input.value.trim();

    if(!command)return;

    add(command,"user");
    input.value="";
    status.textContent="RAKIB THINKING...";

    try{
        const response=await fetch(
            "http://127.0.0.1:8082/ask",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({command})
            }
        );

        const data=await response.json();

        add(
            data.reply || "No response received.",
            "ai"
        );

        status.textContent=
            "RAKIB 3.0 ONLINE • "+
            (data.provider || "core");

        speak(data.reply);

    }catch(error){
        add(
            "RAKIB backend is offline. Start the server.",
            "ai"
        );

        status.textContent="BACKEND OFFLINE";
    }
}

function speak(text){
    if(!text || !("speechSynthesis" in window))return;

    speechSynthesis.cancel();

    const voice=new SpeechSynthesisUtterance(text);
    voice.rate=.95;
    voice.pitch=1;

    speechSynthesis.speak(voice);
}

send.onclick=ask;

input.addEventListener("keydown",e=>{
    if(e.key==="Enter")ask();
});

mic.onclick=()=>{
    if(!("webkitSpeechRecognition" in window ||
         "SpeechRecognition" in window)){
        status.textContent="VOICE INPUT NOT SUPPORTED";
        return;
    }

    const Recognition=
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    const recognition=new Recognition();

    recognition.lang="en-IN";
    recognition.interimResults=false;

    status.textContent="LISTENING...";

    recognition.onresult=e=>{
        input.value=e.results[0][0].transcript;
        ask();
    };

    recognition.onerror=()=>{
        status.textContent="VOICE ERROR";
    };

    recognition.start();
};

status.textContent="RAKIB 3.0 ONLINE";
add("RAKIB 2.0 is ready.","ai");
</script>

</body>
</html>
