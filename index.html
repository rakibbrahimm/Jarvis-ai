<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<!-- MEDIAPIPE -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<script>

/* =========================================================
   RAKIB 2.0
   CORE
   ========================================================= */

"use strict";


const $ = id =>
document.getElementById(id);


/* =========================================================
   THREE ENGINE
   ========================================================= */

let scene3D;
let camera3D;
let renderer;

let hologram;
let core;
let inner;

let ring1;
let ring2;
let ring3;

let particles;


function init3D(){

try{

scene3D =
new THREE.Scene();


camera3D =
new THREE.PerspectiveCamera(
55,
innerWidth / innerHeight,
0.1,
1000
);

camera3D.position.z = 7;


renderer =
new THREE.WebGLRenderer({
antialias:true,
alpha:true
});


renderer.setPixelRatio(
Math.min(
window.devicePixelRatio || 1,
1.5
)
);


renderer.setSize(
innerWidth,
innerHeight
);


$("scene").appendChild(
renderer.domElement
);


/* MAIN GROUP */

hologram =
new THREE.Group();

scene3D.add(
hologram
);


/* CORE */

core =
new THREE.Mesh(

new THREE.IcosahedronGeometry(
1,
2
),

new THREE.MeshBasicMaterial({
color:0x00eaff,
wireframe:true,
transparent:true,
opacity:.95
})

);

hologram.add(core);


/* INNER */

inner =
new THREE.Mesh(

new THREE.IcosahedronGeometry(
.52,
2
),

new THREE.MeshBasicMaterial({
color:0x00eaff,
wireframe:true,
transparent:true,
opacity:.75
})

);

hologram.add(inner);


/* RING */

function makeRing(
size,
rx,
ry
){

const r =
new THREE.Mesh(

new THREE.TorusGeometry(
size,
.018,
12,
100
),

new THREE.MeshBasicMaterial({
color:0x00eaff,
transparent:true,
opacity:.75
})

);

r.rotation.x = rx;
r.rotation.y = ry;

hologram.add(r);

return r;
}


ring1 =
makeRing(
1.45,
0,
0
);


ring2 =
makeRing(
1.85,
Math.PI/2,
0
);


ring3 =
makeRing(
2.25,
Math.PI/4,
Math.PI/4
);


/* PARTICLES */

const count = 700;

const data =
new Float32Array(
count * 3
);

for(
let i=0;
i<data.length;
i++
){

data[i] =
(Math.random()-.5)*15;

}


const geometry =
new THREE.BufferGeometry();


geometry.setAttribute(
"position",
new THREE.BufferAttribute(
data,
3
)
);


particles =
new THREE.Points(

geometry,

new THREE.PointsMaterial({
color:0x00eaff,
size:.025,
transparent:true,
opacity:.65
})

);


scene3D.add(
particles
);


return true;

}catch(error){

console.log(
"3D error:",
error
);

return false;

}

}


/* =========================================================
   HAND STATE
   ========================================================= */

let handActive = false;

let handStream = null;

let handCam = null;

let hands = null;

let handX = .5;
let handY = .5;

let targetX = 0;
let targetY = 0;
let targetZ = 0;

let targetScale = 1;

let currentScale = 1;

let grabbing = false;

let grabX = 0;
let grabY = 0;


/* =========================================================
   ANIMATION
   ========================================================= */

function animate(){

requestAnimationFrame(
animate
);


if(
!renderer ||
!scene3D
)
return;


const time =
Date.now();


let speed =
0.006;


if(
$("status").innerText ===
"LISTENING..."
)
speed = .018;


if(
$("status").innerText ===
"THINKING..."
)
speed = .025;


if(
$("status").innerText ===
"SPEAKING..."
)
speed = .02;


/* CORE */

core.rotation.x +=
speed;

core.rotation.y +=
speed * 1.4;

inner.rotation.x -=
speed * 1.2;

inner.rotation.y -=
speed;


/* RINGS */

ring1.rotation.z +=
speed;

ring2.rotation.z -=
speed * 1.3;

ring3.rotation.z +=
speed * .8;


/* PARTICLES */

particles.rotation.y +=
speed * .05;


/* POSITION */

hologram.position.x +=
(targetX -
hologram.position.x) * .08;


hologram.position.y +=
(targetY -
hologram.position.y) * .08;


hologram.position.z +=
(targetZ -
hologram.position.z) * .08;


/* SCALE */

currentScale +=
(targetScale -
currentScale) * .1;


hologram.scale.set(
currentScale,
currentScale,
currentScale
);


/* HAND TILT */

hologram.rotation.y +=
(
(handX-.5)*1.2 -
hologram.rotation.y
) * .025;


hologram.rotation.x +=
(
(handY-.5)*.8 -
hologram.rotation.x
) * .025;


/* RENDER */

renderer.render(
scene3D,
camera3D
);

}


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
"resize",
function(){

if(
!camera3D ||
!renderer
)
return;


camera3D.aspect =
innerWidth / innerHeight;


camera3D.updateProjectionMatrix();


renderer.setSize(
innerWidth,
innerHeight
);

}
);


/* =========================================================
   VOICE
   ========================================================= */

function jarvisSpeak(
text
){

if(
!("speechSynthesis" in window)
){
return;
}

$("status").innerText =
"SPEAKING...";

$("voiceState").innerText =
"SPEAKING";

speechSynthesis.cancel();

const spokenText = String(text || "").trim();

if(!spokenText){
return;
}

/* =========================================
   AUTOMATIC LANGUAGE DETECTION
   Hindi Devanagari -> hi-IN
   Everything else -> English
   ========================================= */

const hasHindi =
/[\u0900-\u097F]/.test(spokenText);

const targetLang =
hasHindi ? "hi-IN" : "en-US";

const utter =
new SpeechSynthesisUtterance(
spokenText
);

utter.lang =
targetLang;

utter.rate =
hasHindi ? .90 : .88;

utter.pitch =
.72;

utter.volume =
1;

const voices =
speechSynthesis.getVoices();

/* Prefer a real Hindi voice for Hindi text */
let preferred;

if(hasHindi){

preferred =
voices.find(v =>
/^hi(-IN)?$/i.test(v.lang)
);

if(!preferred){

preferred =
voices.find(v =>
/hi[-_]/i.test(v.lang)
);
}

}else{

/* Prefer English voice for English text */
preferred =
voices.find(v =>
/male|david|mark|daniel|alex|james/i.test(v.name)
&&
/^(en)(-|$)/i.test(v.lang)
);

if(!preferred){

preferred =
voices.find(v =>
/^en(-US)?$/i.test(v.lang)
);
}

if(!preferred){

preferred =
voices.find(v =>
/^en[-_]/i.test(v.lang)
);
}

}

if(preferred){

utter.voice =
preferred;

utter.lang =
preferred.lang;

}

utter.onend =
function(){

$("status").innerText =
"SYSTEM ONLINE";

$("voiceState").innerText =
"READY";

};

utter.onerror =
function(){

$("status").innerText =
"SYSTEM ONLINE";

$("voiceState").innerText =
"READY";

};

speechSynthesis.speak(
utter
);

}


/* =========================================================
   VOICE INPUT
   ========================================================= */

function jarvisListen(){

const Recognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if(
!Recognition
){

$("heard").innerText =
"Speech recognition unavailable.";

return;

}


const recognition =
new Recognition();


recognition.lang =
"en-US";


recognition.continuous =
false;


recognition.interimResults =
false;


$("status").innerText =
"LISTENING...";

$("voiceState").innerText =
"LISTENING";


$("heard").innerText =
"Speak now...";


try{

recognition.start();

}catch(error){

return;

}


let jarvisLastReply = "";

recognition.onresult =
async function(event){

const command =
event.results[0][0]
.transcript;


$("heard").innerText =
"You: " + command;


$("status").innerText =
"THINKING...";


$("voiceState").innerText =
"PROCESSING";


const text =
command.toLowerCase();


/* LOCAL COMMANDS */


if(
text.includes(
"open youtube"
)
){

window.open(
"https://www.youtube.com",
"_blank"
);

jarvisLastReply = "Opening YouTube.";

return;

}


if(
text.includes(
"open google"
)
){

window.open(
"https://www.google.com",
"_blank"
);

jarvisLastReply = "Opening Google.";

return;

}


if(
text.includes(
"open chatgpt"
)
){

window.open(
"https://chatgpt.com",
"_blank"
);

jarvisLastReply = "Opening ChatGPT.";

return;

}


if(
text.includes(
"open whatsapp"
)
){

window.open(
"https://web.whatsapp.com",
"_blank"
);

jarvisLastReply = "Opening WhatsApp.";

return;

}


/* BACKEND */

try{

const response =
await fetch(
"http://127.0.0.1:8081/ask",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({
command:command
})
}
);


if(
response.ok
){

const data =
await response.json();


const reply =
data.reply ||
"Command processed.";


$("heard").innerText =
"JARVIS: " + reply;


jarvisLastReply = reply;

try {
  if ("speechSynthesis" in window) {
    window.speechSynthesis.resume();
  }

  if (typeof window.jarvisSpeak === "function") {
    window.jarvisSpeak(reply);
  } else if ("speechSynthesis" in window) {
    const u = new SpeechSynthesisUtterance(String(reply));
    u.lang = "en-US";
    u.rate = 0.88;
    u.pitch = 0.72;
    u.volume = 1;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }
} catch (voiceError) {
  console.log("JARVIS voice error:", voiceError);
}


return;

}

}catch(error){

console.log(
"Backend error:",
error
);

}


jarvisLastReply = "I cannot reach my AI backend right now.";

};


recognition.onerror =
function(event){

$("status").innerText =
"SYSTEM ONLINE";

$("voiceState").innerText =
"READY";

$("heard").innerText =
"Mic: " + event.error;

};

}


/* =========================================================
   HAND CONTROL
   ========================================================= */

async function startHandControl(){

if(
handActive
){

$("handState").innerText =
"TRACKING";

return;

}


/* MEDIA API CHECK */

if(
!navigator.mediaDevices ||
!navigator.mediaDevices.getUserMedia
){

$("handState").innerText =
"ERROR";

$("heard").innerText =
"Camera API unavailable.";

return;

}


/* MEDIAPIPE CHECK */

if(
typeof Hands ===
"undefined"
){

$("handState").innerText =
"ERROR";

$("heard").innerText =
"Hand tracking library unavailable.";

return;

}


if(
typeof Camera ===
"undefined"
){

$("handState").innerText =
"ERROR";

$("heard").innerText =
"Camera helper unavailable.";

return;

}


try{

$("handState").innerText =
"STARTING";


/* CAMERA */

handStream =
await navigator.mediaDevices
.getUserMedia({

video:{
facingMode:"user",
width:640,
height:480
},

audio:false

});


const video =
$("camera");


video.srcObject =
handStream;


video.muted =
true;


await video.play();


document.body.classList.add(
"hand-active"
);


/* HAND MODEL */

hands =
new Hands({

locateFile:function(file){
    return "https://cdn.jsdelivr.net/npm/@mediapipe/hands/"+file;
}

});


hands.setOptions({

maxNumHands:1,

modelComplexity:0,

minDetectionConfidence:.55,

minTrackingConfidence:.55

});


hands.onResults(
handleHandResults
);


/* CAMERA LOOP */

handCam =
new Camera(
video,
{

onFrame:
async function(){

if(
handActive ||
!handActive
){

try{

await hands.send({
image:video
});

}catch(error){

console.log(
"Tracking frame error:",
error
);

}

}

},

width:640,
height:480

}
);


/* IMPORTANT */

handActive =
true;


handCam.start();


$("handState").innerText =
"TRACKING";


$("heard").innerText =
"Hand control online.";


}catch(error){

console.log(
"Hand startup error:",
error
);


$("handState").innerText =
"ERROR";


$("heard").innerText =
"Camera permission required.";


if(
handStream
){

handStream
.getTracks()
.forEach(
track =>
track.stop()
);

handStream =
null;

}


document.body.classList.remove(
"hand-active"
);

}

}


/* =========================================================
   STOP HAND
   ========================================================= */

function stopHandControl(){

handActive =
false;


try{

if(
handCam &&
typeof handCam.stop ===
"function"
){

handCam.stop();

}

}catch(error){}


if(
handStream
){

handStream
.getTracks()
.forEach(
track =>
track.stop()
);

}


handStream =
null;

handCam =
null;

hands =
null;


document.body.classList.remove(
"hand-active"
);


$("handState").innerText =
"OFF";

$("gesture").innerText =
"NONE";

$("mode").innerText =
"IDLE";

$("depth").innerText =
"100%";


targetX =
0;

targetY =
0;

targetZ =
0;

targetScale =
1;

grabbing =
false;


$("heard").innerText =
"Hand control stopped.";

}


/* =========================================================
   DISTANCE
   ========================================================= */

function distance(
a,
b
){

const dx =
a.x-b.x;

const dy =

(function(){

  const plus = document.getElementById("jarvisAttachButton");

  const photo = document.getElementById("jarvisPhotoOption");

  const commandInput =
    document.getElementById("jarvisCommandInput");

  function showMenu(){
    if(!menu) return;

    menu.style.display =
      menu.style.display === "flex"
      ? "none"
      : "flex";
  }

  function readAsDataURL(file){
    return new Promise(function(resolve,reject){

      const reader = new FileReader();

      reader.onload = function(){
        resolve(reader.result);
      };

      reader.onerror = function(){
        reject(new Error("Could not read file"));
      };

      reader.readAsDataURL(file);
    });
  }

  async function analyzeFile(file){

    if(!file) return;

    if(menu)
      menu.style.display = "none";

    const heard =
      document.getElementById("heard");

    const status =
      document.getElementById("status");

    const voiceState =
      document.getElementById("voiceState");

    if(heard)
      heard.innerText =
        "You: Reading " + file.name + "...";

    if(status)
      status.innerText = "ANALYZING...";

    if(voiceState)
      voiceState.innerText = "PROCESSING";

    try{

      const dataURL =
        await readAsDataURL(file);

      const question =
        commandInput.value.trim() ||
        "Read this attachment and tell me what it contains.";

      commandInput.value = "";

      const response = await fetch(
        "http://127.0.0.1:8081/ask",
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify({
            command:question,
            attachment:{
              name:file.name,
              type:file.type || "application/octet-stream",
              data:dataURL
            }
          })
        }
      );

      const data = await response.json();

      const reply =
        data.reply ||
        "I could not analyze this attachment.";

      if(heard)
        heard.innerText = "JARVIS: " + reply;

      if(typeof jarvisLastReply !== "undefined")
        jarvisLastReply = reply;

      if(status)
        status.innerText = "SYSTEM ONLINE";

      if(voiceState)
        voiceState.innerText = "READY";

    }catch(error){

      console.log("JARVIS attachment error:",error);

      if(heard)

      if(status)
        status.innerText = "SYSTEM ONLINE";

      if(voiceState)
        voiceState.innerText = "READY";

    });

  if(files)
    files.addEventListener("click",function(){
      fileInput.click();
    });

  if(cameraInput)
    cameraInput.addEventListener("change",function(){
      if(this.files && this.files[0])
        analyzeFile(this.files[0]);

      this.value = "";
    });

  if(photoInput)
    photoInput.addEventListener("change",function(){
      if(this.files && this.files[0])
        analyzeFile(this.files[0]);

})();

<script>
/* JARVIS 3D TOUCH CONTROL — MASTER */

(function(){

"use strict";

function setupJarvisTouch(){

    if(
        typeof renderer === "undefined" ||
        !renderer ||
        !renderer.domElement ||
        typeof hologram === "undefined" ||
        !hologram ||
        typeof camera3D === "undefined" ||
        !camera3D
    ){
        setTimeout(setupJarvisTouch,500);
        return;
    }

    const canvas = renderer.domElement;

    canvas.style.touchAction = "none";
    canvas.style.userSelect = "none";
    canvas.style.webkitUserSelect = "none";

    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    let lastTap = 0;

    let pinchStart = 0;
    let pinchZoomStart = 7;


    function distance(a,b){

        const dx =
            a.clientX - b.clientX;

        const dy =
            a.clientY - b.clientY;

        return Math.sqrt(
            dx * dx + dy * dy
        );
    }


    function resetCore(){

        hologram.rotation.x = 0;
        hologram.rotation.y = 0;

        camera3D.position.z = 7;

        targetX = 0;
        targetY = 0;
        targetZ = 0;

        targetScale = 1;

        $("heard").innerText =
            "3D CORE RESET.";

    }


    canvas.addEventListener(
        "touchstart",
        function(e){

            e.preventDefault();

            const now = Date.now();

            if(
                e.touches.length === 1 &&
                now - lastTap < 320
            ){

                resetCore();

                lastTap = 0;

                return;
            }

            lastTap = now;


            if(
                e.touches.length === 2
            ){

                dragging = false;

                pinchStart =
                    distance(
                        e.touches[0],
                        e.touches[1]
                    );

                pinchZoomStart =
                    camera3D.position.z;

                return;
            }


            if(
                e.touches.length === 1
            ){

                dragging = true;

                lastX =
                    e.touches[0].clientX;

                lastY =
                    e.touches[0].clientY;
            }

        },
        {
            passive:false
        }
    );


    canvas.addEventListener(
        "touchmove",
        function(e){

            e.preventDefault();


            /* PINCH ZOOM */

            if(
                e.touches.length === 2
            ){

                const current =
                    distance(
                        e.touches[0],
                        e.touches[1]
                    );

                if(pinchStart > 0){

                    const change =
                        current - pinchStart;

                    camera3D.position.z =
                        pinchZoomStart -
                        change * .012;

                    camera3D.position.z =
                        Math.max(
                            4.2,
                            Math.min(
                                10,
                                camera3D.position.z
                            )
                        );
                }

                return;
            }


            /* FINGER ROTATION */

            if(
                e.touches.length === 1 &&
                dragging
            ){

                const x =
                    e.touches[0].clientX;

                const y =
                    e.touches[0].clientY;

                const dx =
                    x - lastX;

                const dy =
                    y - lastY;

                lastX = x;
                lastY = y;


                hologram.rotation.y +=
                    dx * .008;

                hologram.rotation.x +=
                    dy * .008;


                hologram.rotation.x =
                    Math.max(
                        -Math.PI * 1.5,
                        Math.min(
                            Math.PI * 1.5,
                            hologram.rotation.x
                        )
                    );

            }

        },
        {
            passive:false
        }
    );


    canvas.addEventListener(
        "touchend",
        function(e){

            e.preventDefault();

            pinchStart = 0;

            if(
                e.touches.length === 0
            ){

                dragging = false;
            }

            if(
                e.touches.length === 1
            ){

                dragging = true;

                lastX =
                    e.touches[0].clientX;

                lastY =
                    e.touches[0].clientY;
            }

        },
        {
            passive:false
        }
    );


    canvas.addEventListener(
        "touchcancel",
        function(){

            dragging = false;
            pinchStart = 0;

        },
        {
            passive:false
        }
    );


    console.log(
        "JARVIS 3D TOUCH CONTROL ONLINE"
    );

}


window.addEventListener(
    "load",
    function(){

        setTimeout(
            setupJarvisTouch,
            300
        );

    }
);

})();
</script>

<script id="JARVIS_MULTI_USER">
(function(){

  const KEY = "JARVIS_USER_NAME";

  window.jarvisGetUserName = function(){
    return localStorage.getItem(KEY) || "";
  };

  window.jarvisSetUserName = function(name){
    name = String(name || "").trim();
    if(!name) return "";
    localStorage.setItem(KEY, name);
    return name;
  };

  window.jarvisClearUserName = function(){
    localStorage.removeItem(KEY);
  };

  // Detect commands such as:
  // "my name is Ahmed"
  // "call me Ahmed"
  window.jarvisDetectName = function(command){
    const text = String(command || "").trim();

    const patterns = [
      /^(?:my name is|i am|i'm|call me)\s+(.+)$/i
    ];

    for(const pattern of patterns){
      const match = text.match(pattern);
      if(match){
        let name = match[1].trim();
        name = name.replace(/[.!?]+$/,"").trim();

        if(name && name.length <= 40){
          window.jarvisSetUserName(name);
          return name;
        }
      }
    }

    return "";
  };



})();
</script>

<script>
/* RAKIB 10X UPGRADE PACK */
/* =========================================================
   RAKIB 10X UPGRADE PACK
   1  Smart voice
   2  Memory hooks
   3  Chat history
   4  Web/device commands
   5  Gesture hooks
   6  Online/local AI status
   7  Hologram states
   8  Voice activity effect
   9  Multi-user profile
   10 PWA support
   ========================================================= */

(function(){

"use strict";

if(window.__RAKIB_10X__) return;
window.__RAKIB_10X__ = true;


/* =========================================================
   1. SMART VOICE
   ========================================================= */

window.rakibDetectLanguage = function(text){

    text = String(text || "");

    if(/[\u0900-\u097F]/.test(text)){
        return "hi-IN";
    }

    return "en-US";
};


/* =========================================================
   2. MEMORY HOOKS
   ========================================================= */

const MEMORY_KEY = "RAKIB_MEMORY_V1";

window.rakibMemory = {

    get(){
        try{
            return JSON.parse(
                localStorage.getItem(MEMORY_KEY) || "{}"
            );
        }catch(e){
            return {};
        }
    },

    set(key,value){
        const memory = this.get();
        memory[key] = value;
        localStorage.setItem(
            MEMORY_KEY,
            JSON.stringify(memory)
        );
    },

    getValue(key){
        return this.get()[key] || "";
    },

    clear(){
        localStorage.removeItem(MEMORY_KEY);
    }

};


/* =========================================================
   3. CHAT HISTORY
   ========================================================= */

const HISTORY_KEY = "RAKIB_CHAT_HISTORY_V1";

window.rakibHistory = {

    get(){
        try{
            return JSON.parse(
                localStorage.getItem(HISTORY_KEY) || "[]"
            );
        }catch(e){
            return [];
        }
    },

    add(role,text){

        const history = this.get();

        history.push({
            role: String(role || "user"),
            text: String(text || ""),
            time: Date.now()
        });

        /* Keep last 100 messages */
        while(history.length > 100){
            history.shift();
        }

        localStorage.setItem(
            HISTORY_KEY,
            JSON.stringify(history)
        );
    },

    clear(){
        localStorage.removeItem(HISTORY_KEY);
    }

};


/* =========================================================
   4. BASIC WEB COMMANDS
   ========================================================= */

window.rakibCommand = function(command){

    const text =
        String(command || "")
        .trim()
        .toLowerCase();

    if(!text) return false;

    if(
        text === "open youtube" ||
        text === "youtube kholo"
    ){
        window.open(
            "https://www.youtube.com/",
            "_blank"
        );
        return true;
    }

    if(
        text === "open google" ||
        text === "google kholo"
    ){
        window.open(
            "https://www.google.com/",
            "_blank"
        );
        return true;
    }

    if(
        text === "open github" ||
        text === "github kholo"
    ){
        window.open(
            "https://github.com/",
            "_blank"
        );
        return true;
    }

    if(
        text === "what is the time" ||
        text === "time"
    ){

        const now = new Date();

        const answer =
            "The time is " +
            now.toLocaleTimeString();

        if(typeof window.jarvisSpeak === "function"){
            window.jarvisSpeak(answer);
        }

        const reply =
            document.getElementById("jarvisChatReply");

        if(reply){
            reply.innerText = answer;
        }

        return true;
    }

    return false;
};


/* =========================================================
   5. GESTURE HOOKS
   ========================================================= */

window.rakibGesture = function(action){

    action = String(action || "").toLowerCase();

    document.documentElement.dataset.rakibGesture =
        action;

    if(action === "stop"){

        if("speechSynthesis" in window){
            speechSynthesis.cancel();
        }

        window.rakibSetState("READY");
    }

    if(action === "listen"){
        window.rakibSetState("LISTENING");
    }

    if(action === "think"){
        window.rakibSetState("THINKING");
    }

    if(action === "speak"){
        window.rakibSetState("SPEAKING");
    }
};


/* =========================================================
   6. ONLINE / LOCAL AI STATUS
   ========================================================= */

window.rakibCheckBackend = async function(){

    try{

        const response = await fetch(
            "http://127.0.0.1:8081/ask",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    command:"ping"
                })
            }
        );

        if(response.ok){

            document.documentElement.dataset.ai =
                "online";

            return true;
        }

    }catch(e){}

    document.documentElement.dataset.ai =
        "offline";

    return false;
};


/* =========================================================
   7. HOLOGRAM STATE
   ========================================================= */

window.rakibSetState = function(state){

    state = String(state || "READY")
        .toUpperCase();

    document.documentElement.dataset.rakibState =
        state;

    const status =
        document.getElementById("status");

    const voice =
        document.getElementById("voiceState");

    if(state === "LISTENING"){

        if(status)
            status.innerText = "LISTENING...";

        if(voice)
            voice.innerText = "LISTENING";

    }

    else if(state === "THINKING"){

        if(status)
            status.innerText = "THINKING...";

        if(voice)
            voice.innerText = "THINKING";

    }

    else if(state === "SPEAKING"){

        if(status)
            status.innerText = "SPEAKING...";

        if(voice)
            voice.innerText = "SPEAKING";

    }

    else{

        if(status)
            status.innerText = "SYSTEM ONLINE";

        if(voice)
            voice.innerText = "READY";

    }

};


/* =========================================================
   8. VOICE ACTIVITY EFFECT
   ========================================================= */

window.rakibVoiceEffect = function(active){

    document.documentElement.dataset.voice =
        active ? "active" : "idle";
};


/* =========================================================
   9. MULTI USER PROFILE
   ========================================================= */

window.rakibProfile = {

    getName(){

        return (
            localStorage.getItem(
                "JARVIS_USER_NAME"
            ) || ""
        );

    },

    setName(name){

        name =
            String(name || "")
            .trim();

        if(!name) return;

        localStorage.setItem(
            "JARVIS_USER_NAME",
            name
        );

        this.render();

    },

    clear(){

        localStorage.removeItem(
            "JARVIS_USER_NAME"
        );

        this.render();

    },

    render(){

        const name = this.getName();

        document.documentElement.dataset.user =
            name || "guest";

    }

};


/* =========================================================
   10. WAKE WORD / VOICE COMMAND SYSTEM
   ========================================================= */

let recognition = null;
let listening = false;

window.rakibVoiceControl = {

    start(){

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        if(!SpeechRecognition){

            alert(
                "Voice recognition is not supported by this browser."
            );

            return;
        }

        if(listening) return;

        recognition =
            new SpeechRecognition();

        recognition.lang = "en-IN";

        recognition.continuous = true;

        recognition.interimResults = false;

        recognition.onstart = function(){

            listening = true;

            window.rakibSetState(
                "LISTENING"
            );

        };

        recognition.onresult =
        function(event){

            const result =
                event.results[
                    event.results.length - 1
                ][0].transcript.trim();

            const lower =
                result.toLowerCase();

            /*
              Wake word:
              "hey rakib"
              "rakib"
            */

            if(
                lower.includes("hey rakib") ||
                lower.startsWith("rakib")
            ){

                const command =
                    result
                    .replace(
                        /^hey\s+rakib[\s,]*/i,
                        ""
                    )
                    .replace(
                        /^rakib[\s,]*/i,
                        ""
                    )
                    .trim();

                if(command){

                    window.rakibProcessVoice(
                        command
                    );

                }

            }

        };

        recognition.onerror =
        function(){

            listening = false;

            window.rakibSetState(
                "READY"
            );

        };

        recognition.onend =
        function(){

            listening = false;

            window.rakibSetState(
                "READY"
            );

        };

        recognition.start();

    },

    stop(){

        if(recognition){

            recognition.stop();

            recognition = null;

        }

        listening = false;

        window.rakibSetState(
            "READY"
        );

    }

};


/* =========================================================
   VOICE COMMAND PROCESSOR
   ========================================================= */

window.rakibProcessVoice =
async function(command){

    if(!command) return;

    window.rakibHistory.add(
        "user",
        command
    );

    if(
        window.rakibCommand(command)
    ){
        return;
    }

    const input =
        document.getElementById(
            "jarvisChatInput"
        );

    const send =
        document.getElementById(
            "jarvisChatSend"
        );

    if(input){

        input.value = command;

        if(send){
            send.click();
        }

    }

};


/* =========================================================
   WRAP EXISTING SPEECH FUNCTION
   ========================================================= */

if(typeof window.jarvisSpeak === "function"){

    const originalSpeak =
        window.jarvisSpeak;

    window.jarvisSpeak =
    function(text){

        window.rakibSetState(
            "SPEAKING"
        );

        window.rakibVoiceEffect(
            true
        );

        window.rakibHistory.add(
            "assistant",
            text
        );

        originalSpeak(text);

        setTimeout(
            function(){

                window.rakibVoiceEffect(
                    false
                );

            },
            Math.max(
                1500,
                String(text || "").length * 55
            )
        );

    };

}


/* =========================================================
   INITIALIZE
   ========================================================= */

window.rakibProfile.render();

window.rakibCheckBackend();

console.log(
    "RAKIB 10X UPGRADE PACK ONLINE"
);

})();

</script>

<script id="RAKIB_AUDIO_FIX_V2">
(function(){

if(window.__RAKIB_AUDIO_FIX_V2__) return;
window.__RAKIB_AUDIO_FIX_V2__ = true;


/* ==============================
   SPEAKER FIX
============================== */

window.rakibSpeakReliable = function(text){

    text = String(text || "").trim();
    if(!text) return;

    if(!("speechSynthesis" in window)){
        console.log("RAKIB: speechSynthesis unavailable");
        return;
    }

    try{
        speechSynthesis.cancel();
    }catch(e){}

    const speakNow = function(){

        const utter = new SpeechSynthesisUtterance(text);

        const voices = speechSynthesis.getVoices() || [];

        const hasHindi =
            /[\u0900-\u097F]/.test(text);

        let voice = null;

        if(hasHindi){
            voice =
                voices.find(v => /^hi-IN$/i.test(v.lang)) ||
                voices.find(v => /^hi-/i.test(v.lang));
        }

        if(!voice){
            voice =
                voices.find(v => /^en-IN$/i.test(v.lang)) ||
                voices.find(v => /^en-US$/i.test(v.lang)) ||
                voices.find(v => /^en-/i.test(v.lang));
        }

        if(voice){
            utter.voice = voice;
            utter.lang = voice.lang;
        }else{
            utter.lang = hasHindi ? "hi-IN" : "en-IN";
        }

        utter.rate = .90;
        utter.pitch = .78;
        utter.volume = 1;

        utter.onstart = function(){
            const status = document.getElementById("status");
            const voiceState = document.getElementById("voiceState");

            if(status) status.innerText = "SPEAKING...";
            if(voiceState) voiceState.innerText = "SPEAKING";
        };

        utter.onend = function(){
            const status = document.getElementById("status");
            const voiceState = document.getElementById("voiceState");

            if(status) status.innerText = "READY";
            if(voiceState) voiceState.innerText = "READY";
        };

        utter.onerror = function(e){
            console.log("RAKIB TTS ERROR:", e.error);

            const status = document.getElementById("status");
            const voiceState = document.getElementById("voiceState");

            if(status) status.innerText = "READY";
            if(voiceState) voiceState.innerText = "READY";
        };

        speechSynthesis.speak(utter);
    };

    /*
       Android Chrome sometimes returns an empty voice list
       until voiceschanged fires.
    */
    const voices = speechSynthesis.getVoices();

    if(voices && voices.length){
        speakNow();
    }else{
        speechSynthesis.addEventListener(
            "voiceschanged",
            function once(){
                speechSynthesis.removeEventListener(
                    "voiceschanged",
                    once
                );
                speakNow();
            }
        );

        setTimeout(speakNow, 500);
    }
};


/* Replace existing speak function once */

if(typeof window.jarvisSpeak === "function"){

    window.jarvisSpeak = window.rakibSpeakReliable;

}else{

    window.jarvisSpeak = window.rakibSpeakReliable;
}


/* ==============================

============================== */

const SpeechRecognition =

let recognition = null;

if(SpeechRecognition){

    recognition.onresult = function(event){

        const result =
            event.results &&
            event.results[0] &&
            event.results[0][0];

        if(!result) return;

        const text =
            String(result.transcript || "").trim();

        console.log("RAKIB MIC INPUT:", text);

        if(!text) return;

        const input =
            document.getElementById("jarvisChatInput");

        if(input){

            input.value = text;

            input.dispatchEvent(

            const send =

            if(send){

        }

        listening = false;

        const status = document.getElementById("status");
        const voiceState = document.getElementById("voiceState");

        if(status) status.innerText = "READY";
        if(voiceState) voiceState.innerText = "READY";

    recognition.onend = function(){

        listening = false;

        const status = document.getElementById("status");
        const voiceState = document.getElementById("voiceState");

        if(status) status.innerText = "READY";
        if(voiceState) voiceState.innerText = "READY";

}else{

    console.log(
        "RAKIB MIC: SpeechRecognition unavailable"
    );

/* ==============================
   FLOATING MIC BUTTON
============================== */

function bindRakibMic(){

    const mic =
        document.getElementById("jarvisFloatingMic");

    if(!mic){
        console.log(
            "RAKIB MIC: #jarvisFloatingMic not found"
        );

);


/* Allow browser to initialise voices */

if("speechSynthesis" in window){

<!-- =========================================================
     JARVIS MASTER 10X CONTROL CORE
     Safe additive layer - existing JARVIS systems preserved
========================================================= -->
<script>
(() => {
  "use strict";

  if (window.__JARVIS_MASTER_10X__) return;
  window.__JARVIS_MASTER_10X__ = true;

  const API = "http://127.0.0.1:8081/ask";
  let busy = false;

  function findInput() {
    return document.querySelector(
      '#jarvisChatInput, #chatInput, textarea[placeholder*="Talk"], input[placeholder*="Talk"], textarea[placeholder*="RAKIB"], input[placeholder*="RAKIB"]'
    );
  }

  function findSend() {
    return document.querySelector(
      '#jarvisSendButton, #sendButton, button[type="submit"], button'
    );
  }

  function findOutput() {
    return document.querySelector(
      '#jarvisOutput, #jarvisReply, #chatOutput, #response, #jarvisResponse, .jarvis-output'
    );
  }

  function speak(text) {
    if (!text) return;

    if (typeof window.jarvisSpeak === "function") {
      try {
        window.jarvisSpeak(String(text));
        return;
      } catch (_) {}
    }

    if ("speechSynthesis" in window) {
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(String(text));
        u.rate = 1;
        u.pitch = 1;
        speechSynthesis.speak(u);
      } catch (_) {}
    }
  }

  function show(text) {
    const out = findOutput();
    if (out) {
      out.textContent = String(text);
      out.scrollTop = out.scrollHeight;
    }

    window.dispatchEvent(
      new CustomEvent("jarvis:reply", { detail: String(text) })
    );
  }

  async function ask(text) {
    text = String(text || "").trim();
    if (!text || busy) return;

    busy = true;

    const input = findInput();
    if (input) input.disabled = true;

    show("Thinking...");

    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 30000);

      const response = await fetch(API, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({command: text}),
        signal: controller.signal
      });

      clearTimeout(timer);

      if (!response.ok) {
        throw new Error("Backend HTTP " + response.status);
      }

      const data = await response.json();
      const reply =
        data.reply ||
        data.response ||
        data.answer ||
        "I received your command.";

      show(reply);
      speak(reply);

    } catch (err) {
      console.error("JARVIS MASTER CORE:", err);

      const message =
        err.name === "AbortError"
          ? "JARVIS backend timed out."
          : "JARVIS backend is offline. Start server.py on port 8081.";

      show(message);
    } finally {
      busy = false;
      if (input) input.disabled = false;
      if (input) input.focus();
    }
  }

  window.JARVIS_MASTER_ASK = ask;

  /* ENTER = SEND */
  document.addEventListener("keydown", e => {
    if (e.key !== "Enter" || e.shiftKey) return;

    const input = findInput();
    if (!input || document.activeElement !== input) return;

    e.preventDefault();
    ask(input.value);
  }, true);

  /* SEND button fallback */
  document.addEventListener("click", e => {
    const el = e.target.closest("button");
    if (!el) return;

    const text = (el.innerText || el.textContent || "").trim().toUpperCase();

    if (!["SEND", "ASK", "GO"].includes(text)) return;

    const input = findInput();
    if (!input || !input.value.trim()) return;

    e.preventDefault();
    e.stopImmediatePropagation();
    ask(input.value);
  }, true);

  /* TOUCH SAFETY */
  document.addEventListener("touchstart", e => {
    if (e.touches.length > 1) {
      document.documentElement.style.touchAction = "none";
    }
  }, {passive: true});

  document.addEventListener("touchend", () => {
    document.documentElement.style.touchAction = "";
  }, {passive: true});

  /* BACKEND HEALTH */
  async function healthCheck() {
    try {
      const r = await fetch(API.replace("/ask", "/"), {
        method: "GET",
        cache: "no-store"
      });

      document.documentElement.dataset.jarvisBackend =
        r.ok ? "online" : "offline";

      window.dispatchEvent(
        new CustomEvent("jarvis:backend", {
          detail: {online: r.ok}
        })
      );
    } catch (_) {
      document.documentElement.dataset.jarvisBackend = "offline";
    }
  }

  /* Keyboard shortcuts */
  document.addEventListener("keydown", e => {
    if (e.ctrlKey && e.key.toLowerCase() === "l") {
      e.preventDefault();
      const input = findInput();
      if (input) {
        input.focus();
        input.select();
      }
    }
  });

  healthCheck();
  setInterval(healthCheck, 15000);

  console.log("JARVIS MASTER 10X CONTROL CORE ONLINE");
})();
</script>

    if(box){
        box.style.display = "block";
        box.textContent = reply;
    }

    const heard = el("heard");

    if(heard){
        heard.textContent = "RAKIB: " + reply;
    }

    window.jarvisLastReply = reply;

    return reply;
}


/* =========================================================
   RELIABLE SPEAKER
========================================================= */

window.rakibFinalSpeak = function(text){

    text = String(text || "")
        .replace(/<[^>]*>/g," ")
        .replace(/\s+/g," ")
        .trim();

    if(!text) return;

    if(!("speechSynthesis" in window)){
        console.log("RAKIB TTS unavailable");
        return;
    }

    try{
        speechSynthesis.cancel();
        speechSynthesis.resume();
    }catch(e){}

    const speakNow = function(){

        try{

            const u =
                new SpeechSynthesisUtterance(text);

            const voices =
                speechSynthesis.getVoices() || [];

            const hindi =
                /[\u0900-\u097F]/.test(text);

            let voice = null;

            if(hindi){

                voice =
                    voices.find(v => /^hi-IN$/i.test(v.lang)) ||
                    voices.find(v => /^hi-/i.test(v.lang));

            }else{

                voice =
                    voices.find(v => /^en-IN$/i.test(v.lang)) ||
                    voices.find(v => /^en-US$/i.test(v.lang)) ||
                    voices.find(v => /^en-/i.test(v.lang));

            }

            if(voice){
                u.voice = voice;
                u.lang = voice.lang;
            }else{
                u.lang = hindi ? "hi-IN" : "en-IN";
            }

            u.rate = 0.90;
            u.pitch = 0.78;
            u.volume = 1;

            u.onstart = function(){
                setState("SPEAKING...");
            };

            u.onend = function(){
                setState("READY");
            };

            u.onerror = function(e){
                console.log("RAKIB FINAL TTS ERROR:", e);
                setState("READY");
            };

            speechSynthesis.speak(u);

        }catch(e){

            console.log("RAKIB FINAL SPEAK ERROR:",e);
            setState("READY");

        }
    };

    const voices =
        speechSynthesis.getVoices();

    if(voices && voices.length){

        speakNow();

    }else{

        let done = false;

        const once = function(){

            if(done) return;

            done = true;

            try{
                speechSynthesis.removeEventListener(
                    "voiceschanged",
                    once
                );
            }catch(e){}

            speakNow();
        };

        speechSynthesis.addEventListener(
            "voiceschanged",
            once
        );

        setTimeout(once,700);
    }
};


/* Make every later jarvisSpeak call use the reliable speaker */
window.jarvisSpeak = window.rakibFinalSpeak;


/* =========================================================
   BACKEND COMMAND PIPELINE
========================================================= */

window.rakibFinalSend = async function(command){

    command = String(command || "").trim();

    if(!command || sending) return;

    sending = true;

    setState("THINKING...");

    const box = el("jarvisChatReply");

    if(box){
        box.style.display = "block";
        box.textContent = "RAKIB is thinking...";
    }

    try{

        const controller =
            new AbortController();

        const timer =
            setTimeout(
                () => controller.abort(),
                30000
            );

        const response =
            await fetch(API,{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    command:command
                }),
                signal:controller.signal
            });

        clearTimeout(timer);

        if(!response.ok){
            throw new Error(
                "HTTP " + response.status
            );
        }

        const data =
            await response.json();

        const reply =
            data.reply ||
            data.response ||
            "Command processed.";

        showReply(reply);

        setState("SPEAKING...");

        window.rakibFinalSpeak(reply);

        try{
            window.dispatchEvent(
                new CustomEvent(
                    "JARVIS_REPLY",
                    {detail:reply}
                )
            );
        }catch(e){}

    }catch(error){

        console.log(
            "RAKIB FINAL BACKEND ERROR:",
            error
        );

        const msg =
            error.name === "AbortError"
            ? "RAKIB backend timed out."
            : "RAKIB backend connection failed. Start server.py on port 8081.";

        showReply(msg);
        setState("READY");

    }finally{

        sending = false;

    }
};


/* =========================================================
   CHAT INPUT
========================================================= */

function bindChat(){

    const input =
        el("jarvisChatInput");

    const send =
        el("jarvisChatSend");

    if(!input || !send){
        console.log("RAKIB FINAL: chat controls missing");
        return;
    }

    /* Clone removes old duplicate listeners */
    const newSend =
        send.cloneNode(true);

    send.parentNode.replaceChild(
        newSend,
        send
    );

    const newInput =
        input.cloneNode(true);

    input.parentNode.replaceChild(
        newInput,
        input
    );

    newSend.addEventListener(
        "click",
        function(e){

            e.preventDefault();

            const command =
                newInput.value.trim();

            if(!command) return;

            newInput.value = "";

            window.rakibFinalSend(command);
        }
    );

    newInput.addEventListener(
        "keydown",
        function(e){

            if(e.key === "Enter"){

                e.preventDefault();

                const command =
                    newInput.value.trim();

                if(!command) return;

                newInput.value = "";

                window.rakibFinalSend(command);
            }
        }
    );

    console.log("RAKIB FINAL: chat online");
}


/* =========================================================
   MICROPHONE
========================================================= */

function setupRecognition(){

    const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!Recognition){

        console.log(
            "RAKIB FINAL: SpeechRecognition unavailable"
        );

        setText(
            "heard",
            "Voice input is not supported by this browser."
        );

        return null;
    }

    const r =
        new Recognition();

    r.lang = "en-IN";
    r.continuous = false;
    r.interimResults = false;
    r.maxAlternatives = 1;

    r.onstart = function(){

        listening = true;

        setState("LISTENING...");

        const mic =
            el("jarvisFloatingMic");

        if(mic){
            mic.classList.add("listening");
        }

        setText(
            "heard",
            "Speak now..."
        );

        console.log(
            "RAKIB FINAL MIC: LISTENING"
        );
    };

    r.onresult = function(event){

        const result =
            event.results &&
            event.results[0] &&
            event.results[0][0];

        if(!result) return;

        const text =
            String(
                result.transcript || ""
            ).trim();

        console.log(
            "RAKIB FINAL MIC INPUT:",
            text
        );

        if(!text) return;

        const input =
            el("jarvisChatInput");

        if(input){
            input.value = text;
        }

        window.rakibFinalSend(text);
    };

    r.onerror = function(event){

        console.log(
            "RAKIB FINAL MIC ERROR:",
            event.error
        );

        listening = false;

        const mic =
            el("jarvisFloatingMic");

        if(mic){
            mic.classList.remove("listening");
        }

        setState("READY");

        setText(
            "heard",
            "Mic: " + (event.error || "unknown error")
        );
    };

    r.onend = function(){

        listening = false;

        const mic =
            el("jarvisFloatingMic");

        if(mic){
            mic.classList.remove("listening");
        }

        if(!sending){
            setState("READY");
        }

        console.log(
            "RAKIB FINAL MIC: END"
        );
    };

    return r;
}


/* =========================================================
   FLOATING MIC
========================================================= */

function bindMic(){

    const mic =
        el("jarvisFloatingMic");

    if(!mic){
        console.log(
            "RAKIB FINAL: floating mic missing"
        );
        return;
    }

    /*
       Clone the mic so every old addEventListener
       attached by previous patches is removed.
    */
    const newMic =
        mic.cloneNode(true);

    mic.parentNode.replaceChild(
        newMic,
        mic
    );

    recognition =
        setupRecognition();

    newMic.addEventListener(
        "click",
        function(e){

            e.preventDefault();
            e.stopPropagation();

            if(!recognition){

                setText(
                    "heard",
                    "Voice input unavailable in this browser."
                );

                return;
            }

            if(listening){

                try{
                    recognition.stop();
                }catch(err){}

                return;
            }

            try{

                /*
                   Stop speech before listening so RAKIB
                   does not hear its own output.
                */
                if("speechSynthesis" in window){
                    speechSynthesis.cancel();
                }

                recognition.start();

            }catch(err){

                console.log(
                    "RAKIB FINAL MIC START ERROR:",
                    err
                );

                listening = false;
                setState("READY");
            }
        }
    );

    console.log(
        "RAKIB FINAL: floating mic online"
    );
}


/* =========================================================
   HAND CONTROL SAFE BIND
========================================================= */

function bindHandButtons(){

    const buttons =
        document.querySelectorAll(
            'button[onclick="startHandControl()"]'
        );

    buttons.forEach(function(button){

        const clone =
            button.cloneNode(true);

        button.parentNode.replaceChild(
            clone,
            button
        );

        clone.addEventListener(
            "click",
            async function(e){

                e.preventDefault();

                try{

                    if(typeof window.startHandControl === "function"){

                        await window.startHandControl();

                    }else{

                        setText(
                            "heard",
                            "Hand control engine is unavailable."
                        );

                    }

                }catch(error){

                    console.log(
                        "RAKIB HAND START ERROR:",
                        error
                    );

                    setText(
                        "heard",
                        "Hand control error: " +
                        error.message
                    );

                    setText(
                        "handState",
                        "ERROR"
                    );
                }
            }
        );
    });

    const stopButtons =
        document.querySelectorAll(
            'button[onclick="stopHandControl()"]'
        );

    stopButtons.forEach(function(button){

        const clone =
            button.cloneNode(true);

        button.parentNode.replaceChild(
            clone,
            button
        );

        clone.addEventListener(
            "click",
            function(e){

                e.preventDefault();

                try{

                    if(typeof window.stopHandControl === "function"){
                        window.stopHandControl();
                    }

                    setText(
                        "handState",
                        "READY"
                    );

                }catch(error){

                    console.log(
                        "RAKIB HAND STOP ERROR:",
                        error
                    );
                }
            }
        );
    });

    console.log(
        "RAKIB FINAL: hand buttons rebound"
    );
}


/* =========================================================
   START
========================================================= */

function boot(){

    bindChat();
    bindMic();
    bindHandButtons();

    setState("READY");

    console.log(
        "========================================"
    );

    console.log(
        "RAKIB FINAL I/O CORE ONLINE"
    );

    console.log(
        "VOICE: READY"
    );

    console.log(
        "MIC: READY"
    );

    console.log(
        "CHAT: READY"
    );

    console.log(
        "HAND: BOUND"
    );

    console.log(
        "========================================"
    );
}

if(
    document.readyState === "loading"
){
    document.addEventListener(
        "DOMContentLoaded",
        boot
    );
}else{
    boot();
}

})();
</script>

<script>
(function(){

"use strict";

if(window.__RAKIB_CHAT_FETCH_REPAIR__) return;
window.__RAKIB_CHAT_FETCH_REPAIR__ = true;

const API = "http://127.0.0.1:8081/ask";

function replyBox(){
    return document.getElementById("jarvisChatReply");
}

function heardBox(){
    return document.getElementById("heard");
}

function show(text){
    text = String(text || "");

    const box = replyBox();
    if(box){
        box.style.display = "block";
        box.textContent = text;
    }

    const heard = heardBox();
    if(heard){
        heard.textContent = "RAKIB: " + text;
    }
}

async function send(command){

    command = String(command || "").trim();

    if(!command) return;

    show("RAKIB is thinking...");

    const controller = new AbortController();

    const timeout = setTimeout(function(){
        controller.abort();
    },30000);

    try{

        const response = await fetch(API,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                command:command
            }),
            signal:controller.signal
        });

        clearTimeout(timeout);

        const raw = await response.text();

        console.log("RAKIB HTTP:",response.status);
        console.log("RAKIB RAW:",raw);

        if(!response.ok){
            throw new Error(
                "Backend HTTP " + response.status +
                ": " + raw.slice(0,200)
            );
        }

        let data;

        try{
            data = JSON.parse(raw);
        }catch(e){
            throw new Error(
                "Backend returned invalid JSON: " +
                raw.slice(0,200)
            );
        }

        const reply =
            data.reply ||
            data.response ||
            data.message ||
            "Backend returned no reply.";

        show(reply);

        if(typeof window.rakibFinalSpeak === "function"){
            window.rakibFinalSpeak(reply);
        }else if(typeof window.jarvisSpeak === "function"){
            window.jarvisSpeak(reply);
        }

    }catch(error){

        clearTimeout(timeout);

        console.error(
            "RAKIB CHAT ERROR:",
            error
        );

        let msg;

        if(error.name === "AbortError"){
            msg = "RAKIB backend timed out.";
        }else{
            msg =
                "RAKIB connection error: " +
                error.message;
        }

        show(msg);
    }
}

window.rakibDirectSend = send;

console.log(
    "RAKIB CHAT FETCH REPAIR ONLINE"
);

})();
</script>
